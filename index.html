<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>America Clicker</title>
    <link rel="icon" type="image/x-icon" href="images/American-Flag-Icon.png" />
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <main class="game-layout">
      <div class="header">
        <h1>America Clicker</h1>
        <p id="money-display">Money: $<span id="click-count">0</span></p>
      </div>
      
      <aside class="stats-panel">
        <div class="approval-rating">
          <p>Approval Rating:</p>
          <div class="approval-bar-container">
            <div id="approval-bar"></div>
          </div>
        </div>
      </aside>

      <section class="game-area">
        <button id="click-button">
          <img src="images/American-Flag.png" alt="American Flag" width="400" height="224" />
        </button>
      </section>
      
      <aside class="shop-panel" id="shop-items"></aside>
    </main>
    
    <script src="script.js" defer></script>
  </body>
</html>

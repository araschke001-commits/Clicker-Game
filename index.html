<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>America Clicker</title>
    <link rel="icon" type="image/x-icon" href="images/American-Flag-Icon.png" />
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <main class="game-layout">
      <aside class="stats-panel">
        <div class="approval-rating">
          <p>Approval Rating:</p>
          <div class="approval-bar-container">
            <div id="approval-bar"></div>
            <p id="approval-percentage">50%</p>
          </div>
        </div>

        <div class="eagle-display">
          <p>Eagle Count:</p>
          <p><span id="eagle-count">0</span><span id="eagle-label"> Eagles</span></p>
        </div>

        <div class="click-value-display">
          <p>Click Value:</p>
          <p id="click-value">1</p>
        </div>

        <div class="boost-display">
          <p>Boost:</p>
          <p><span id="boost-multiply">1</span>x</p>
        </div>
      </aside>

      <section class="game-area">
        <div class="header">
          <h1>America Clicker</h1>

          <div class="money-display">
            <p>Money: $<span id="money-count">0</span></p>
          </div>
        </div>

        <button id="click-button">
          <img src="images/American-Flag.png" alt="American Flag" width="400" height="224" />
        </button>
      </section>
      
      <aside class="shop-panel" id="shop-items"></aside>
    </main>
    
    <script src="script.js" defer></script>
  </body>
</html>
